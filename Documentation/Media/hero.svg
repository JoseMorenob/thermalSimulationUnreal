<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">IRSim — Physics-based infrared rendering</title>
  <desc id="desc">An independent C++17 radiometry core connected to Unreal Engine 5. Abstract thermal grid illustration.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172038"/></linearGradient>
    <linearGradient id="heat"><stop stop-color="#313265"/><stop offset=".4" stop-color="#b25b89"/><stop offset=".72" stop-color="#ffae69"/><stop offset="1" stop-color="#fff2c4"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#536484" stroke-width=".6" opacity=".35"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#background)"/>
  <rect x="74" y="70" width="5" height="22" rx="2" fill="#ffb86b"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="96" y="88" fill="#b4c2d9" font-size="16" letter-spacing="4">SCENE → RADIANCE → SENSOR</text>
    <text x="72" y="200" fill="#f3f6fc" font-size="94" font-weight="700" letter-spacing="-3">IRSim</text>
    <text x="76" y="254" fill="#f3f6fc" font-size="30">Physics-based infrared rendering.</text>
    <text x="76" y="298" fill="#aebdd3" font-size="21">An independent radiometry core. A live Unreal workflow.</text>
    <text x="76" y="372" fill="#ffb86b" font-size="16" letter-spacing="2">C++17   /   UNREAL ENGINE 5   /   LWIR</text>
  </g>
  <rect x="872" y="76" width="308" height="276" rx="12" fill="#0b1020" stroke="#35445f"/>
  <rect x="886" y="90" width="280" height="224" rx="6" fill="url(#grid)"/>
  <g fill="url(#heat)">
    <rect x="914" y="174" width="196" height="84" rx="8"/>
    <rect x="970" y="146" width="84" height="140" rx="8" opacity=".8"/>
    <rect x="942" y="118" width="28" height="28" rx="4" opacity=".4"/>
    <rect x="1110" y="146" width="28" height="28" rx="4" opacity=".5"/>
  </g>
  <rect x="914" y="330" width="196" height="6" rx="3" fill="url(#heat)"/>
  <path d="M896 108v-10h10m240 0h10v10M896 296v10h10m240 0h10v-10" fill="none" stroke="#e8effb" stroke-width="2"/>
</svg>
